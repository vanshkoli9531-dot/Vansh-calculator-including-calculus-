<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vansh Calculator | onescalculator.com</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    :root {
      --bg:#000; --surface:#0d0d0d; --surface2:#1a1a1a; --surface3:#252525; --surface4:#2e2e2e;
      --border:#2a2a2a; --text:#f5f5f5; --text-muted:#8a8a8a; --accent:#ff9500; --accent-hover:#ffaa33;
      --danger:#ff453a; --success:#30d158; --blue:#0a84ff; --purple:#bf5af2; --radius:14px; --radius-sm:11px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
    .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
    .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#ff6b00);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#000}
    .domain{font-size:0.65rem;color:var(--text-muted);font-weight:400;margin-top:1px}
    .nav-tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px}
    .nav-tab{padding:7px 12px;border:none;background:transparent;color:var(--text-muted);font-size:0.82rem;font-weight:500;border-radius:8px;cursor:pointer;transition:all .18s}
    .nav-tab.active{background:var(--surface4);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .nav-tab:hover:not(.active){color:var(--text)}
    .main{flex:1;display:flex;justify-content:center;padding:16px 12px 28px;max-width:440px;margin:0 auto;width:100%}
    .calc-container{width:100%;display:flex;flex-direction:column;gap:12px}
    .display-card{background:var(--surface);border-radius:var(--radius);padding:18px 18px 16px;border:1px solid var(--border);min-height:112px;display:flex;flex-direction:column;justify-content:flex-end}
    .expression{font-family:'JetBrains Mono',monospace;font-size:1.55rem;font-weight:500;color:var(--text);text-align:right;min-height:28px;word-break:break-all;line-height:1.25;transition:color .2s,font-size .2s}
    .expression.final{font-size:.95rem;color:var(--text-muted);font-weight:400}
    .result{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:400;text-align:right;word-break:break-all;line-height:1.2;color:var(--text-muted);min-height:26px;transition:color .2s,font-size .2s}
    .result.final{font-size:2.45rem;font-weight:500;color:var(--text)}
    .result.small{font-size:1.55rem}
    .keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;user-select:none}
    .btn{aspect-ratio:1;border:none;border-radius:var(--radius-sm);font-size:1.15rem;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .12s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text)}
    .btn:active{transform:scale(.92)}
    .btn:hover{background:var(--surface3)}
    .btn.num{background:var(--surface3);font-size:1.3rem}
    .btn.num:hover{background:#323232}
    .btn.op{color:var(--accent);font-size:1.35rem;font-weight:600}
    .btn.fn{font-size:.88rem;color:#b0b0b0;background:var(--surface)}
    .btn.fn:hover{background:var(--surface2);color:var(--text)}
    .btn.ac{color:var(--danger);font-weight:600}
    .btn.equals{background:linear-gradient(145deg,var(--accent),#ff6b00);color:#000;font-weight:700;font-size:1.5rem}
    .btn.equals:hover{background:linear-gradient(145deg,var(--accent-hover),#ff8533);box-shadow:0 4px 16px rgba(255,149,0,.35)}
    .btn.history-btn{color:var(--blue)}
    .btn.second-active{background:var(--accent);color:#000}
    .converter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .conv-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all .18s}
    .conv-item:hover{background:var(--surface2);border-color:var(--accent);transform:translateY(-1px)}
    .conv-icon{width:28px;height:28px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px}
    .conv-label{font-size:.74rem;font-weight:500;color:var(--text);text-align:center;line-height:1.2}
    .converter-detail{display:none;flex-direction:column;gap:12px}
    .converter-detail.active{display:flex}
    .back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--accent);font-size:.92rem;font-weight:500;cursor:pointer;padding:4px 0}
    .conv-title{font-size:1.25rem;font-weight:600;margin-bottom:2px}
    .unit-row{display:flex;flex-direction:column;gap:5px}
    .unit-row label{font-size:.72rem;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
    .unit-input-group{display:flex;gap:8px;align-items:center}
    .unit-input-group input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:1.3rem;color:var(--text);font-family:'JetBrains Mono',monospace;outline:none;min-width:0}
    .unit-input-group input:focus{border-color:var(--accent)}
    .unit-input-group select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;color:var(--text);font-size:.85rem;min-width:110px;max-width:130px;outline:none;cursor:pointer}
    .swap-btn{align-self:center;width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--accent);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s}
    .swap-btn:hover{background:var(--accent);color:#000;transform:rotate(180deg)}
    .factor-hint{font-size:.78rem;color:var(--text-muted);text-align:center;padding:6px 0 2px;font-family:'JetBrains Mono',monospace}
    /* COMPACT converter keypad - the fix for big buttons */
    .conv-keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;max-width:260px;margin-left:auto;margin-right:auto}
    .conv-keypad .btn{aspect-ratio:1.3;font-size:1.05rem;border-radius:10px;height:46px;min-height:46px}
    .conv-keypad .btn.equals{background:linear-gradient(145deg,var(--accent),#ff6b00);color:#000;font-size:1.15rem}
    .history-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);max-height:240px;overflow-y:auto;display:none}
    .history-panel.active{display:block}
    .history-header{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
    .history-header h3{font-size:.88rem;font-weight:600}
    .clear-history{background:none;border:none;color:var(--danger);font-size:.8rem;cursor:pointer;font-weight:500}
    .history-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
    .history-item:hover{background:var(--surface2)}
    .history-item:last-child{border-bottom:none}
    .hist-expr{font-size:.78rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
    .hist-result{font-size:1.05rem;font-weight:500;font-family:'JetBrains Mono',monospace;margin-top:2px}
    .empty-history{padding:32px 16px;text-align:center;color:var(--text-muted);font-size:.85rem}
    .calculus-panel{display:none;flex-direction:column;gap:12px}
    .calculus-panel.active{display:flex}
    .calc-input-area{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:16px}
    .calc-input-area label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:7px;font-weight:500}
    .calc-input-area input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:1.1rem;color:var(--text);font-family:'JetBrains Mono',monospace;outline:none}
    .calc-input-area input:focus{border-color:var(--accent)}
    .calc-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .calc-btn{padding:13px 8px;border:none;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
    .calc-btn.diff{background:linear-gradient(135deg,#0a84ff,#0066cc);color:#fff}
    .calc-btn.integ{background:linear-gradient(135deg,#bf5af2,#9b3dcc);color:#fff}
    .calc-btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.25)}
    .calc-result-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:16px;min-height:84px}
    .calc-result-card h4{font-size:.75rem;color:var(--text-muted);margin-bottom:7px;font-weight:500}
    .calc-result{font-family:'JetBrains Mono',monospace;font-size:1.25rem;word-break:break-all;line-height:1.4}
    .examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
    .example-chip{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:4px 11px;font-size:.74rem;cursor:pointer;color:var(--text-muted);transition:all .12s}
    .example-chip:hover{border-color:var(--accent);color:var(--accent)}
    .output-mode{display:flex;gap:8px;margin-top:10px;align-items:center}
    .output-mode label{font-size:.78rem;color:var(--text-muted);margin:0}
    .mode-toggle{display:flex;background:var(--surface2);border-radius:8px;padding:2px}
    .mode-toggle button{border:none;background:transparent;color:var(--text-muted);padding:5px 12px;border-radius:6px;font-size:.8rem;font-weight:500;cursor:pointer}
    .mode-toggle button.active{background:var(--surface4);color:var(--text)}
    .note-text{font-size:.76rem;color:var(--text-muted);line-height:1.45;margin-top:8px}
    .result-box{background:var(--surface2);border-radius:11px;padding:14px;font-family:'JetBrains Mono',monospace;line-height:1.7;font-size:1rem}
    .result-highlight{color:var(--accent);font-size:1.25rem;font-weight:600;margin-top:3px}
    .bmi-scale{height:9px;border-radius:5px;background:linear-gradient(to right,#0a84ff 0%,#30d158 28%,#ffd60a 55%,#ff9500 78%,#ff453a 100%);margin:12px 0 7px;position:relative}
    .bmi-marker{position:absolute;top:-5px;width:3px;height:19px;background:#fff;border-radius:2px;box-shadow:0 0 5px rgba(0,0,0,.45);transform:translateX(-50%)}
    .bmi-categories{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-muted);margin-bottom:10px}
    .bmi-badge{display:inline-block;padding:3px 11px;border-radius:16px;font-size:.78rem;font-weight:600;margin-top:5px}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--surface3);color:var(--text);padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .28s;z-index:200;border:1px solid var(--border)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .footer{text-align:center;padding:12px;font-size:.7rem;color:var(--text-muted);border-top:1px solid var(--border)}
    .mode{display:none}.mode.active{display:block}.hidden{display:none!important}
    .gst-rate-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:.9rem;cursor:pointer;font-weight:500}
    .gst-rate-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
    @media(max-width:400px){.keypad{gap:6px}.btn{font-size:1rem}.btn.num{font-size:1.15rem}.expression{font-size:1.35rem}.result.final{font-size:2.1rem}.nav-tab{padding:6px 9px;font-size:.76rem}.converter-grid{gap:8px}.conv-item{padding:12px 5px}.conv-keypad{max-width:240px}.conv-keypad .btn{height:42px;min-height:42px;font-size:1rem}}
  </style>
</head>
<body>
  <header class="header">
    <div class="logo"><div class="logo-icon">V</div><div><div>Vansh Calculator</div><div class="domain">onescalculator.com</div></div></div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-mode="calculator">Calculator</button>
      <button class="nav-tab" data-mode="converter">Converter</button>
      <button class="nav-tab" data-mode="calculus">Calculus</button>
    </nav>
  </header>
  <main class="main">
    <div class="calc-container">
      <div class="mode active" id="mode-calculator">
        <div class="display-card">
          <div class="expression" id="expression"></div>
          <div class="result" id="result">0</div>
        </div>
        <div class="history-panel" id="historyPanel">
          <div class="history-header"><h3>History</h3><button class="clear-history" id="clearHistory">Clear</button></div>
          <div id="historyList"></div>
        </div>
        <div class="keypad" id="keypad">
          <button class="btn fn" data-fn="2nd" id="btn2nd">2nd</button>
          <button class="btn fn" data-fn="deg" id="btnDeg">deg</button>
          <button class="btn fn" data-fn="sin" id="btnSin">sin</button>
          <button class="btn fn" data-fn="cos" id="btnCos">cos</button>
          <button class="btn fn" data-fn="tan" id="btnTan">tan</button>
          <button class="btn fn" data-fn="pow">xʸ</button>
          <button class="btn fn" data-fn="log">lg</button>
          <button class="btn fn" data-fn="ln">ln</button>
          <button class="btn fn" data-fn="(">(</button>
          <button class="btn fn" data-fn=")">)</button>
          <button class="btn fn" data-fn="sqrt">√x</button>
          <button class="btn ac" data-fn="ac">AC</button>
          <button class="btn fn" data-fn="back">⌫</button>
          <button class="btn op" data-fn="%">%</button>
          <button class="btn op" data-fn="/">÷</button>
          <button class="btn fn" data-fn="fact">x!</button>
          <button class="btn num" data-num="7">7</button>
          <button class="btn num" data-num="8">8</button>
          <button class="btn num" data-num="9">9</button>
          <button class="btn op" data-fn="*">×</button>
          <button class="btn fn" data-fn="inv">1/x</button>
          <button class="btn num" data-num="4">4</button>
          <button class="btn num" data-num="5">5</button>
          <button class="btn num" data-num="6">6</button>
          <button class="btn op" data-fn="-">−</button>
          <button class="btn fn" data-fn="pi">π</button>
          <button class="btn num" data-num="1">1</button>
          <button class="btn num" data-num="2">2</button>
          <button class="btn num" data-num="3">3</button>
          <button class="btn op" data-fn="+">+</button>
          <button class="btn history-btn" data-fn="history">↺</button>
          <button class="btn fn" data-fn="e">e</button>
          <button class="btn num" data-num="0">0</button>
          <button class="btn num" data-num=".">.</button>
          <button class="btn equals" data-fn="=">=</button>
        </div>
      </div>
      <div class="mode" id="mode-converter">
        <div id="converterMenu"><div class="converter-grid" id="convGrid"></div></div>
        <div class="converter-detail" id="converterDetail">
          <button class="back-btn" id="convBack">← Back</button>
          <h2 class="conv-title" id="convTitle">Length</h2>
          <div id="standardConvUI">
            <div class="unit-row"><label>From</label><div class="unit-input-group"><input type="text" id="fromValue" value="1" inputmode="decimal"><select id="fromUnit"></select></div></div>
            <button class="swap-btn" id="swapUnits" title="Swap">⇅</button>
            <div class="unit-row"><label>To</label><div class="unit-input-group"><input type="text" id="toValue" readonly><select id="toUnit"></select></div></div>
            <div class="factor-hint" id="factorHint"></div>
            <div class="conv-keypad" id="convKeypad">
              <button class="btn num" data-k="7">7</button><button class="btn num" data-k="8">8</button><button class="btn num" data-k="9">9</button><button class="btn fn" data-k="C">C</button>
              <button class="btn num" data-k="4">4</button><button class="btn num" data-k="5">5</button><button class="btn num" data-k="6">6</button><button class="btn fn" data-k="back">⌫</button>
              <button class="btn num" data-k="1">1</button><button class="btn num" data-k="2">2</button><button class="btn num" data-k="3">3</button><button class="btn op" data-k=".">.</button>
              <button class="btn num" data-k="00">00</button><button class="btn num" data-k="0">0</button><button class="btn equals" data-k="=" style="grid-column:span 2">=</button>
            </div>
          </div>
          <div id="specialConvUI" class="hidden"></div>
        </div>
      </div>
      <div class="mode" id="mode-calculus">
        <div class="calculus-panel active">
          <div class="calc-input-area">
            <label>Enter a polynomial (high degrees supported)</label>
            <input type="text" id="calcExpr" placeholder="e.g. 4x^5 − 3x³ + 2x − 7" autocomplete="off" spellcheck="false">
            <div class="examples">
              <span class="example-chip" data-ex="x^2">x²</span>
              <span class="example-chip" data-ex="3x^3 - 2x + 1">3x³ − 2x + 1</span>
              <span class="example-chip" data-ex="x^4 + 5x^2 - 3">x⁴ + 5x² − 3</span>
              <span class="example-chip" data-ex="2x^5 - 4x^3 + x">2x⁵ − 4x³ + x</span>
              <span class="example-chip" data-ex="7x^6 + 3x^2 - 9">7x⁶ + 3x² − 9</span>
            </div>
            <div class="output-mode">
              <label>Answer form:</label>
              <div class="mode-toggle">
                <button id="modeFrac" class="active">Fraction</button>
                <button id="modeDec">Decimal</button>
              </div>
            </div>
          </div>
          <div class="calc-actions">
            <button class="calc-btn diff" id="btnDiff">d/dx  Differentiate</button>
            <button class="calc-btn integ" id="btnInteg">∫  Integrate</button>
          </div>
          <div class="calc-result-card">
            <h4 id="calcResultLabel">Result</h4>
            <div class="calc-result" id="calcResult">—</div>
          </div>
          <p class="note-text">Works with expanded polynomials. Answers preferred as fractions.</p>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <footer class="footer">Vansh Calculator • onescalculator.com</footer>
  <script>
    let currentExpr='',currentResult='0',justEvaluated=false,isSecond=false,isDeg=true;
    let history=JSON.parse(localStorage.getItem('vansh_history')||'[]');
    let currentMode='calculator',currentConv=null,fracMode=true;
    const expressionEl=document.getElementById('expression'),resultEl=document.getElementById('result');
    const historyPanel=document.getElementById('historyPanel'),historyList=document.getElementById('historyList'),toast=document.getElementById('toast');

    function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
    function formatNumber(n){
      if(n===Infinity||n===-Infinity)return '∞';
      if(typeof n!=='number'||isNaN(n))return 'Error';
      if(!isFinite(n))return '∞';
      if(Math.abs(n)>=1e15)return n.toExponential(6);
      if(Math.abs(n)>0&&Math.abs(n)<1e-10)return n.toExponential(6);
      return parseFloat(n.toPrecision(12)).toString();
    }
    function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a||1}
    class Fraction{
      constructor(n,d=1){n=Number(n);d=Number(d);if(!isFinite(n)||!isFinite(d)||d===0){this.n=NaN;this.d=1;return}
        const sign=(n<0)!==(d<0)?-1:1;n=Math.abs(n);d=Math.abs(d);
        if(!Number.isInteger(n)||!Number.isInteger(d)){const a=floatToFraction(n/d);this.n=sign*a.n;this.d=a.d;return}
        const g=gcd(n,d);this.n=sign*(n/g);this.d=d/g}
      add(o){return new Fraction(this.n*o.d+o.n*this.d,this.d*o.d)}
      mul(o){return new Fraction(this.n*o.n,this.d*o.d)}
      div(o){return new Fraction(this.n*o.d,this.d*o.n)}
      toNumber(){return this.n/this.d}
      toString(){if(isNaN(this.n))return'NaN';if(this.d===1)return String(this.n);if(this.n===0)return'0';return this.n+'/'+this.d}
      abs(){return new Fraction(Math.abs(this.n),this.d)}
    }
    function floatToFraction(x,maxDen=1e5){
      if(!isFinite(x))return{n:NaN,d:1};const sign=x<0?-1:1;x=Math.abs(x);if(x===0)return{n:0,d:1};
      let a=Math.floor(x);if(x===a)return{n:sign*a,d:1};let h1=1,h2=0,k1=0,k2=1,b=x;
      while(true){a=Math.floor(b);const h=a*h1+h2,k=a*k1+k2;if(k>maxDen)break;h2=h1;h1=h;k2=k1;k1=k;b=1/(b-a);if(!isFinite(b)||Math.abs(x-h/k)<1e-14)break}
      return{n:sign*h1,d:k1}
    }

    function evaluateExpression(raw){
      if(!raw||!raw.trim())return NaN;
      try{
        let e=raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')
          .replace(/π/g,'Math.PI').replace(/\be\b/g,'Math.E')
          .replace(/√\(/g,'Math.sqrt(').replace(/∛\(/g,'Math.cbrt(')
          .replace(/lg\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(')
          .replace(/sin⁻¹\(/g,'asind(').replace(/cos⁻¹\(/g,'acosd(').replace(/tan⁻¹\(/g,'atand(')
          .replace(/sin\(/g,'sind(').replace(/cos\(/g,'cosd(').replace(/tan\(/g,'tand(')
          .replace(/(\d+(?:\.\d+)?)%/g,'($1/100)')
          .replace(/(\d+(?:\.\d+)?)!/g,(_,n)=>{const v=factorial(parseFloat(n));return isFinite(v)?String(v):'NaN'})
          .replace(/\^/g,'**');
        // Implicit multiplication
        e=e.replace(/(\d)(Math\.(PI|E))/g,'$1*$2')
          .replace(/(Math\.(PI|E))(\d)/g,'$1*$3')
          .replace(/(Math\.(PI|E))(Math\.(PI|E))/g,'$1*$3')
          .replace(/(\))(\()/g,'$1*$2').replace(/(\d)(\()/g,'$1*$2')
          .replace(/(Math\.(PI|E))(\()/g,'$1*$3');
        const helpers=`
          const isDeg=${isDeg};
          function sind(x){return isDeg?Math.sin(x*Math.PI/180):Math.sin(x)}
          function cosd(x){return isDeg?Math.cos(x*Math.PI/180):Math.cos(x)}
          function tand(x){return isDeg?Math.tan(x*Math.PI/180):Math.tan(x)}
          function asind(x){if(x<-1||x>1)return NaN;const r=Math.asin(x);return isDeg?r*180/Math.PI:r}
          function acosd(x){if(x<-1||x>1)return NaN;const r=Math.acos(x);return isDeg?r*180/Math.PI:r}
          function atand(x){const r=Math.atan(x);return isDeg?r*180/Math.PI:r}
        `;
        const result=Function('"use strict";'+helpers+'return ('+e+')')();
        if(typeof result!=='number')return NaN;
        return result;
      }catch{return NaN}
    }
    function factorial(n){if(n<0||!Number.isInteger(n))return NaN;if(n>170)return Infinity;let r=1;for(let i=2;i<=n;i++)r*=i;return r}

    function updateDisplay(){
      expressionEl.textContent=currentExpr||'';
      resultEl.textContent=currentResult;
      if(justEvaluated){expressionEl.classList.add('final');resultEl.classList.add('final');resultEl.classList.toggle('small',String(currentResult).length>14)}
      else{expressionEl.classList.remove('final');resultEl.classList.remove('final');resultEl.classList.remove('small')}
    }
    function isFinishedNumber(){
      if(justEvaluated)return true;
      if(!currentExpr)return false;
      const c=currentExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      return /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(c)||/^[πe]$/.test(currentExpr)||
        (currentExpr.endsWith(')')&&!isNaN(evaluateExpression(currentExpr)));
    }
    function getCurrentValue(){if(justEvaluated)return parseFloat(currentResult)||0;const v=evaluateExpression(currentExpr);return isNaN(v)?0:v}

    function appendToExpr(val){
      if(justEvaluated&&/[0-9.]/.test(val)){currentExpr='';currentResult='0';justEvaluated=false}
      justEvaluated=false;
      if((val==='π'||val==='e')&&currentExpr.length>0){const last=currentExpr.slice(-1);if(/[0-9πe)]/.test(last))currentExpr+='×'}
      if(/[0-9]/.test(val)&&currentExpr.length>0){const last=currentExpr.slice(-1);if(last==='π'||last==='e'||last===')')currentExpr+='×'}
      currentExpr+=val;
      try{const p=evaluateExpression(currentExpr);if(!isNaN(p)||p===Infinity||p===-Infinity)currentResult=formatNumber(p);else currentResult=''}catch{currentResult=''}
      updateDisplay();
    }

    function applyUnary(fn){
      let value=getCurrentValue(),displayName='',result;
      switch(fn){
        case'sqrt':if(value<0){showToast('Cannot √ negative');currentResult='Error';justEvaluated=true;updateDisplay();return}result=Math.sqrt(value);displayName='√('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'cbrt':result=Math.cbrt(value);displayName='∛('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'inv':if(value===0){showToast('Division by zero');currentResult='Error';justEvaluated=true;updateDisplay();return}result=1/value;displayName='1/('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'log':if(value<=0){showToast('Log needs positive number');currentResult='Error';justEvaluated=true;updateDisplay();return}result=Math.log10(value);displayName='lg('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'ln':if(value<=0){showToast('Ln needs positive number');currentResult='Error';justEvaluated=true;updateDisplay();return}result=Math.log(value);displayName='ln('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'sin':result=isDeg?Math.sin(value*Math.PI/180):Math.sin(value);displayName='sin('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'cos':result=isDeg?Math.cos(value*Math.PI/180):Math.cos(value);displayName='cos('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'tan':result=isDeg?Math.tan(value*Math.PI/180):Math.tan(value);displayName='tan('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'asin':if(value<-1||value>1){showToast('asin domain [-1,1]');currentResult='Error';justEvaluated=true;updateDisplay();return}result=isDeg?Math.asin(value)*180/Math.PI:Math.asin(value);displayName='sin⁻¹('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'acos':if(value<-1||value>1){showToast('acos domain [-1,1]');currentResult='Error';justEvaluated=true;updateDisplay();return}result=isDeg?Math.acos(value)*180/Math.PI:Math.acos(value);displayName='cos⁻¹('+(justEvaluated?currentResult:currentExpr)+')';break;
        case'atan':result=isDeg?Math.atan(value)*180/Math.PI:Math.atan(value);displayName='tan⁻¹('+(justEvaluated?currentResult:currentExpr)+')';break;
        default:return;
      }
      currentResult=!isFinite(result)?'∞':isNaN(result)?'Error':formatNumber(result);
      currentExpr=displayName;justEvaluated=true;addToHistory(displayName,currentResult);updateDisplay();
    }

    function handleFunction(fn){
      switch(fn){
        case'ac':currentExpr='';currentResult='0';justEvaluated=false;updateDisplay();break;
        case'back':
          if(justEvaluated){currentExpr='';currentResult='0';justEvaluated=false}
          else{currentExpr=currentExpr.slice(0,-1);if(!currentExpr)currentResult='0';else{const p=evaluateExpression(currentExpr);currentResult=(isNaN(p)&&p!==Infinity&&p!==-Infinity)?'':formatNumber(p)}}
          updateDisplay();break;
        case'=':
          if(!currentExpr)return;
          const res=evaluateExpression(currentExpr);
          if(isNaN(res)&&res!==Infinity&&res!==-Infinity){currentResult='Error';showToast('Invalid expression')}
          else{currentResult=formatNumber(res);addToHistory(currentExpr,currentResult)}
          justEvaluated=true;updateDisplay();break;
        case'history':historyPanel.classList.toggle('active');renderHistory();break;
        case'2nd':
          isSecond=!isSecond;document.getElementById('btn2nd').classList.toggle('second-active',isSecond);
          document.getElementById('btnSin').textContent=isSecond?'sin⁻¹':'sin';
          document.getElementById('btnCos').textContent=isSecond?'cos⁻¹':'cos';
          document.getElementById('btnTan').textContent=isSecond?'tan⁻¹':'tan';
          showToast(isSecond?'2nd ON – inverse':'2nd OFF');break;
        case'deg':isDeg=!isDeg;document.getElementById('btnDeg').textContent=isDeg?'deg':'rad';showToast(isDeg?'Degrees':'Radians');break;
        case'sin':
          if(isFinishedNumber())applyUnary(isSecond?'asin':'sin');else appendToExpr(isSecond?'sin⁻¹(':'sin(');
          if(isSecond){isSecond=false;document.getElementById('btn2nd').classList.remove('second-active');document.getElementById('btnSin').textContent='sin';document.getElementById('btnCos').textContent='cos';document.getElementById('btnTan').textContent='tan'}
          break;
        case'cos':
          if(isFinishedNumber())applyUnary(isSecond?'acos':'cos');else appendToExpr(isSecond?'cos⁻¹(':'cos(');
          if(isSecond){isSecond=false;document.getElementById('btn2nd').classList.remove('second-active');document.getElementById('btnSin').textContent='sin';document.getElementById('btnCos').textContent='cos';document.getElementById('btnTan').textContent='tan'}
          break;
        case'tan':
          if(isFinishedNumber())applyUnary(isSecond?'atan':'tan');else appendToExpr(isSecond?'tan⁻¹(':'tan(');
          if(isSecond){isSecond=false;document.getElementById('btn2nd').classList.remove('second-active');document.getElementById('btnSin').textContent='sin';document.getElementById('btnCos').textContent='cos';document.getElementById('btnTan').textContent='tan'}
          break;
        case'sqrt':
          if(isSecond){if(isFinishedNumber())applyUnary('cbrt');else appendToExpr('∛(');isSecond=false;document.getElementById('btn2nd').classList.remove('second-active');showToast('Cube root')}
          else{if(isFinishedNumber())applyUnary('sqrt');else appendToExpr('√(')}break;
        case'log':if(isFinishedNumber())applyUnary('log');else appendToExpr('lg(');break;
        case'ln':if(isFinishedNumber())applyUnary('ln');else appendToExpr('ln(');break;
        case'pow':appendToExpr('^');break;
        case'fact':
          if(isFinishedNumber()){const n=getCurrentValue(),f=factorial(n);if(isNaN(f)){currentResult='Error';showToast('Factorial needs non-negative integer')}else{currentResult=formatNumber(f);currentExpr=n+'!';addToHistory(currentExpr,currentResult)}justEvaluated=true;updateDisplay()}
          else appendToExpr('!');break;
        case'inv':if(isFinishedNumber())applyUnary('inv');else appendToExpr('1/(');break;
        case'pi':appendToExpr('π');break;
        case'e':appendToExpr('e');break;
        case'(':case')':appendToExpr(fn);break;
        case'%':appendToExpr('%');break;
        case'+':case'-':case'*':case'/':appendToExpr(fn==='*'?'×':fn==='/'?'÷':fn==='-'?'−':fn);break;
      }
    }

    document.getElementById('keypad').addEventListener('click',e=>{const btn=e.target.closest('.btn');if(!btn)return;if(btn.dataset.num!==undefined)appendToExpr(btn.dataset.num);else if(btn.dataset.fn)handleFunction(btn.dataset.fn)});

      else if(e.key==='+')handleFunction('+');else if(e.key==='-')handleFunction('-');else if(e.key==='*')handleFunction('*');else if(e.key==='/')handleFunction('/');
      else if(e.key==='Enter'||e.key==='=')handleFunction('=');else if(e.key==='Backspace')handleFunction('back');else if(e.key==='Escape')handleFunction('ac');
      else if(e.key==='('||e.key===')')appendToExpr(e.key);else if(e.key==='%')handleFunction('%');else if(e.key==='^')handleFunction('pow');
    });

        let rate=5;const upd=()=>{const a=parseFloat(document.getElementById('gstAmt').value)||0;const tax=a*rate/100;document.getElementById('gstResult').innerHTML=`<div>GST Amount: ${formatNumber(tax)}</div><div style="font-size:0.85rem;color:var(--text-muted)">CGST / SGST : ${formatNumber(tax/2)} each</div><div class="result-highlight">Total: ${formatNumber(a+tax)}</div>`};
        document.querySelectorAll('.gst-rate-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.gst-rate-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');rate=parseFloat(b.dataset.r);upd()}));
        document.getElementById('gstAmt').oninput=upd;upd();
      }else if(key==='numeral'){
        sp.innerHTML=`<div class="unit-row"><label>Number</label><input type="text" id="numVal" value="42" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;font-size:1.15rem;color:var(--text);font-family:'JetBrains Mono',monospace"></div><div class="unit-row"><label>From Base</label><select id="numFrom" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px;color:var(--text);font-size:0.95rem"><option value="10">Decimal (10)</option><option value="2">Binary (2)</option><option value="8">Octal (8)</option><option value="16">Hexadecimal (16)</option></select></div><div class="unit-row"><label>Converted</label><div id="numResults" class="result-box"></div></div>`;
        const upd=()=>{try{const val=document.getElementById('numVal').value.trim();const from=parseInt(document.getElementById('numFrom').value);const dec=parseInt(val,from);if(isNaN(dec))throw new Error();document.getElementById('numResults').innerHTML=`<div>Decimal : ${dec}</div><div>Binary  : ${dec.toString(2)}</div><div>Octal   : ${dec.toString(8)}</div><div>Hex     : ${dec.toString(16).toUpperCase()}</div>`}catch{document.getElementById('numResults').innerHTML='<div style="color:var(--danger)">Invalid number for selected base</div>'}};
        document.getElementById('numVal').oninput=upd;document.getElementById('numFrom').onchange=upd;upd();
      }
    }

    function parsePolynomial(str){str=str.replace(/\s+/g,'').replace(/−/g,'-').replace(/–/g,'-').toLowerCase();if(!str)return[];if(str[0]!=='+'&&str[0]!=='-')str='+'+str;const terms=[];const re=/([+-])(\d*\.?\d*)?(x(?:\^(\d+))?)?/g;let m;while((m=re.exec(str))!==null){if(!m[2]&&!m[3])continue;const sign=m[1]==='-'?-1:1;let coef=1;if(m[2]!==undefined&&m[2]!=='')coef=parseFloat(m[2]);coef*=sign;let power=0;if(m[3])power=m[4]!==undefined?parseInt(m[4],10):1;terms.push({coef:new Fraction(coef),power})}return terms}
    function combineTerms(terms){const map={};terms.forEach(t=>{const p=t.power;if(!map[p])map[p]=new Fraction(0);map[p]=map[p].add(t.coef)});return Object.keys(map).map(Number).sort((a,b)=>b-a).filter(p=>Math.abs(map[p].toNumber())>1e-14).map(p=>({coef:map[p],power:p}))}
    function polyToString(terms,asFraction){terms=combineTerms(terms);if(!terms.length)return'0';let parts=[];terms.forEach((t,idx)=>{const c=t.coef,absC=c.abs(),isNeg=c.toNumber()<0;let coefStr=asFraction?absC.toString():formatNumber(absC.toNumber());if(t.power>0&&coefStr==='1')coefStr='';let termStr=t.power===0?(coefStr||'0'):t.power===1?(coefStr||'')+'x':(coefStr||'')+'x^'+t.power;if(idx===0)parts.push(isNeg?'−'+termStr:termStr);else parts.push(isNeg?' − '+termStr:' + '+termStr)});return parts.join('')||'0'}
    function differentiate(terms){return terms.filter(t=>t.power!==0).map(t=>({coef:t.coef.mul(new Fraction(t.power)),power:t.power-1}))}
    function integrate(terms){return terms.map(t=>({coef:t.coef.div(new Fraction(t.power+1)),power:t.power+1}))}

    document.getElementById('modeFrac').addEventListener('click',()=>{fracMode=true;document.getElementById('modeFrac').classList.add('active');document.getElementById('modeDec').classList.remove('active')});
    document.getElementById('modeDec').addEventListener('click',()=>{fracMode=false;document.getElementById('modeDec').classList.add('active');document.getElementById('modeFrac').classList.remove('active')});
    document.getElementById('btnDiff').addEventListener('click',()=>{const expr=document.getElementById('calcExpr').value.trim();if(!expr){showToast('Enter an expression first');return}try{const terms=parsePolynomial(expr);if(!terms.length)throw new Error();const result=polyToString(differentiate(terms),fracMode);document.getElementById('calcResultLabel').textContent='Derivative  d/dx';document.getElementById('calcResult').textContent=result}catch{document.getElementById('calcResult').textContent='Could not parse. Use expanded form like 3x^2 + 2x − 5';showToast('Parse error')}});
    document.getElementById('btnInteg').addEventListener('click',()=>{const expr=document.getElementById('calcExpr').value.trim();if(!expr){showToast('Enter an expression first');return}try{const terms=parsePolynomial(expr);if(!terms.length)throw new Error();const result=polyToString(integrate(terms),fracMode)+' + C';document.getElementById('calcResultLabel').textContent='Indefinite Integral  ∫';document.getElementById('calcResult').textContent=result}catch{document.getElementById('calcResult').textContent='Could not parse. Use expanded form like 3x^2 + 2x − 5';showToast('Parse error')}});
    document.querySelectorAll('.example-chip').forEach(chip=>chip.addEventListener('click',()=>{document.getElementById('calcExpr').value=chip.dataset.ex}));

    updateDisplay();renderHistory();
  </script>
</body>
